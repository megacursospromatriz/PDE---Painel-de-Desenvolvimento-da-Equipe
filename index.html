/* ================= PLANNER (calendário do mês) ================= */
function monthCalTasksAndDaily(){
  const u = state.currentUser;
  const canBrowse = canBrowseOthersAgenda(u);
  let relevantTasks;
  if(canBrowse && state.dailyUserFilter==='todos'){
    const allowedIds = allowedAgendaUserIds(u);
    relevantTasks = state.tasks.filter(t=>allowedIds.includes(t.ownerId));
  } else if(canBrowse && allowedAgendaUserIds(u).includes(state.dailyUserFilter)){
    relevantTasks = tasksForUser(state.dailyUserFilter);
  } else {
    relevantTasks = tasksForUser(u.id);
  }
  if(state.companyFilter!=='todas') relevantTasks = relevantTasks.filter(t=>t.company===state.companyFilter);

  let relevantDaily;
  if(canBrowse && state.dailyUserFilter==='todos'){
    const allowedIds = allowedAgendaUserIds(u);
    relevantDaily = state.dailyTasks.filter(d=>allowedIds.includes(d.assignedTo));
  } else if(canBrowse && allowedAgendaUserIds(u).includes(state.dailyUserFilter)){
    relevantDaily = state.dailyTasks.filter(d=>d.assignedTo===state.dailyUserFilter);
  } else {
    relevantDaily = state.dailyTasks.filter(d=>d.assignedTo===u.id);
  }

  return {relevantTasks, relevantDaily};
}

function monthCalTemplate(){
  const u = state.currentUser;
  const isMaster = u.role==='master';
  const {year, month} = monthMeta(state.calendarMonth);
  const totalDays = daysInMonth(year, month);
  const startWeekday = firstWeekdayOfMonth(year, month);
  const {relevantTasks, relevantDaily} = monthCalTasksAndDaily();

  const tasksByDate = {};
  relevantTasks.forEach(t=>{ if(t.date) (tasksByDate[t.date] = tasksByDate[t.date]||[]).push(t); });
  const dailyByDate = {};
  relevantDaily.forEach(d=>{ if(d.date) (dailyByDate[d.date] = dailyByDate[d.date]||[]).push(d); });

  const weekdayLabels = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  const today = todayStr();
  const maxShow = 3;

  let cellsHtml = '';
  for(let i=0;i<startWeekday;i++) cellsHtml += `<div class="cal-cell cal-cell-empty"></div>`;
  for(let d=1; d<=totalDays; d++){
    const dateStr = `${year}-${pad2(month)}-${pad2(d)}`;
    const dayTasks = (tasksByDate[dateStr]||[]).slice().sort((a,b)=>(a.time||'').localeCompare(b.time||''));
    const dayDaily = dailyByDate[dateStr] || [];
    const isToday = dateStr === today;
    const shown = dayTasks.slice(0, maxShow);
    const extra = dayTasks.length - shown.length;
    cellsHtml += `
      <div class="cal-cell ${isToday?'cal-today':''}" data-cal-day="${dateStr}">
        <div class="cal-daynum">${d}${isToday?'<span class="cal-today-tag">hoje</span>':''}</div>
        <div class="cal-items">
          ${shown.map(t=>{
            const cm = companyMeta(t.company); const sm = statusMeta(t.taskStatus);
            return `<div class="cal-item" style="background:${cm.bg};color:${cm.color};" title="${escapeHtml(t.title)}">
              <span class="cal-item-dot" style="background:${sm.color}"></span><span class="cal-item-text">${escapeHtml(t.title)}</span>
            </div>`;
          }).join('')}
          ${extra>0 ? `<div class="cal-item-more">+${extra}</div>` : ''}
        </div>
        ${dayDaily.length ? `<div class="cal-daily-badge">${icon('calendar',10)}${dayDaily.length}</div>` : ''}
      </div>`;
  }
  const trailing = (7 - ((startWeekday+totalDays) % 7)) % 7;
  for(let i=0;i<trailing;i++) cellsHtml += `<div class="cal-cell cal-cell-empty"></div>`;

  return `
    ${!state.gcalHelpDismissed ? gcalHelpBannerTemplate() : ''}
    <div class="toolbar" style="margin-top:0;">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
        <button class="btn btn-icon" id="calPrevBtn">${icon('chevronLeft',15)}</button>
        <div class="cal-month-label">${monthLabelPT(state.calendarMonth)}</div>
        <button class="btn btn-icon" id="calNextBtn">${icon('chevronRight',15)}</button>
        ${state.calendarMonth!==currentMonthStr() ? `<button class="btn btn-ghost btn-sm" id="calTodayBtn">Mês atual</button>` : ''}
        ${canBrowseOthersAgenda(u) ? `
        <select id="calUserFilter" style="padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:13px;font-weight:600;color:var(--text-900);">
          <option value="todos" ${state.dailyUserFilter==='todos'?'selected':''}>Todos os colaboradores</option>
          <option value="${u.id}" ${state.dailyUserFilter===u.id?'selected':''}>Só a minha agenda</option>
          ${visibleColleaguesFor(u).map(x=>`<option value="${x.id}" ${state.dailyUserFilter===x.id?'selected':''}>${escapeHtml(x.name)}</option>`).join('')}
        </select>` : ''}
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        <button class="btn btn-ghost" id="calExportExcelBtn" title="Exportar em Excel — melhor para editar em massa">${icon('download',15)} Exportar Excel</button>
        <button class="btn btn-ghost" id="calImportExcelBtn">${icon('upload',15)} Importar Excel</button>
        <input type="file" id="calImportExcelInput" accept=".xlsx,.xls" style="display:none;">
        <button class="btn btn-ghost" id="calExportIcsBtn" title="Exportar o mês para Google Agenda, Outlook etc.">${icon('download',15)} Exportar mês (.ics)</button>
        <button class="btn btn-ghost" id="calImportIcsBtn">${icon('upload',15)} Importar .ics</button>
        <input type="file" id="calImportIcsInput" accept=".ics,text/calendar" style="display:none;">
        <button class="btn btn-primary" id="calNewAgendaBtn">${icon('plus',16)} Nova Agenda</button>
      </div>
    </div>
    <div class="chip-row" style="margin-bottom:18px;">
      <button class="chip ${state.companyFilter==='todas'?'active':''}" data-filter="todas">Todas as empresas</button>
      ${COMPANIES.map(c=>`
        <button class="chip ${state.companyFilter===c.key?'active':''}" data-filter="${c.key}">
          <span class="dot" style="background:${c.color}"></span>${c.label}
        </button>`).join('')}
    </div>
    <div class="cal-wrap">
      <div class="cal-weekdays">${weekdayLabels.map(w=>`<div class="cal-weekday">${w}</div>`).join('')}</div>
      <div class="cal-grid">${cellsHtml}</div>
    </div>
  `;
}

  document.querySelectorAll('[data-cal-day]').forEach(cell=>{

  const {year, month} = monthMeta(state.calendarMonth);
  const totalDays = daysInMonth(year, month);
  const startWeekday = firstWeekdayOfMonth(year, month);
  const targetTasks = tasksForUser(targetId);
  const tasksByDate = {};
  targetTasks.forEach(t=>{ if(t.date) (tasksByDate[t.date] = tasksByDate[t.date]||[]).push(t); });

  const weekdayLabels = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  const today = todayStr();
  const maxShow = 3;
  let cellsHtml = '';
  for(let i=0;i<startWeekday;i++) cellsHtml += `<div class="cal-cell cal-cell-empty"></div>`;
  for(let d=1; d<=totalDays; d++){
    const dateStr = `${year}-${pad2(month)}-${pad2(d)}`;
    const dayTasks = (tasksByDate[dateStr]||[]).slice().sort((a,b)=>(a.time||'').localeCompare(b.time||''));
    const isToday = dateStr===today;
    const shown = dayTasks.slice(0,maxShow);
    const extra = dayTasks.length - shown.length;
    cellsHtml += `

            </div>`;
          }).join('')}
          ${extra>0 ? `<div class="cal-item-more">+${extra}</div>` : ''}
        </div>
      </div>`;
  }
  const trailing = (7 - ((startWeekday+totalDays) % 7)) % 7;
  for(let i=0;i<trailing;i++) cellsHtml += `<div class="cal-cell cal-cell-empty"></div>`;

  return `

      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
        <select id="uaTargetUser" style="padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:13px;font-weight:600;">

        <div class="cal-month-label">${monthLabelPT(state.calendarMonth)}</div>
        <button class="btn btn-icon" id="uaNextBtn">${icon('chevronRight',15)}</button>

const CHECKLIST_COMPANY_SHEET_NAMES = {grupo:'Grupo MEGA', cvb:'Instituto CVB', multicursos:'Mega Multi Cursos', cursospro:'Mega Cursos Pro', estacio:'Estácio', pessoal:'Pessoal'};
function exportChecklist(){
  if(!window.XLSX){ toast('Biblioteca de Excel não carregou — verifique sua internet.', 'err'); return; }
  const wb = XLSX.utils.book_new();
  const usedSheetNames = new Set();
  COMPANIES.forEach(c=>{
    const items = state.checklistItems.filter(i=>i.company===c.key);
    if(!items.length) return;
    const rows = [
      ['Checklist de Tarefas'],
      ['☐','Tarefa','Responsável','Prioridade','Status','Observação'],
      ...items.map(it=>[
        it.status==='concluido', it.text||'', it.responsavel||'',
        checklistPriorityMeta(it.priority).label, checklistStatusMeta(it.status).label, it.observacao||'',
      ]),
    ];
    let sheetName = (CHECKLIST_COMPANY_SHEET_NAMES[c.key]||c.label).slice(0,31);
    while(usedSheetNames.has(sheetName)) sheetName = (sheetName+'_').slice(0,31);
    usedSheetNames.add(sheetName);
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), sheetName);
  });
  if(!usedSheetNames.size){ toast('Não há itens no checklist para exportar.', 'err'); return; }
  XLSX.writeFile(wb, `mega-checklist-${todayStr()}.xlsx`);
  toast('Checklist exportado.');
}
async function importChecklistFile(file){
  if(!window.XLSX){ toast('Biblioteca de Excel não carregou.', 'err'); return; }
  let wb;
  try{ wb = XLSX.read(await file.arrayBuffer(), {type:'array'}); }
  catch(e){ toast('Não foi possível ler o arquivo.', 'err'); return; }

  const newItems = [];
  const u = state.currentUser;
  wb.SheetNames.forEach(sheetName=>{
    const companyKey = matchCompanyBrand(sheetName) || primaryCompany(u);
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], {header:1, raw:true, defval:''});
    let headerIdx = -1;
    for(let i=0;i<rows.length;i++){
      const rowText = rows[i].map(c=>String(c||'').toLowerCase());
      if(rowText.some(c=>c.includes('tarefa')) && rowText.some(c=>c.includes('status'))){ headerIdx = i; break; }
    }
    if(headerIdx<0) return;
    for(let i=headerIdx+1;i<rows.length;i++){
      const row = rows[i];
      const text = String(row[1]||'').trim();
      if(!text) continue;
      const checked = row[0]===true || String(row[0]).toLowerCase()==='true' || String(row[0]).trim()==='☑';
      const statusLabel = String(row[4]||'').toLowerCase();
      let status = 'pendente';
      if(checked || statusLabel.includes('conclu')) status = 'concluido';
      else if(statusLabel.includes('andamento')) status = 'andamento';
      const priorityLabel = String(row[3]||'').toLowerCase();
      const priority = priorityLabel.includes('alta') ? 'alta' : priorityLabel.includes('baix') ? 'baixa' : 'media';
      newItems.push({
        id: uid('cl'), company: companyKey, text, responsavel: String(row[2]||'').trim(),
        priority, status, observacao: String(row[5]||'').trim(), createdBy: u.id, createdByName: u.name, createdAt: Date.now(),
      });
    }
  });

  if(!newItems.length){ toast('Nenhum item reconhecido no arquivo.', 'err'); return; }
  openConfirmModal(`Encontramos ${newItems.length} item(ns) no arquivo. Importar todos para o checklist?`, async ()=>{
    state.checklistItems.push(...newItems);
    await saveChecklist();
    toast('Checklist importado.');
    render();
  });
}

      const file = e.target.files && e.target.files[0];
      if(file) importChecklistFile(file);
      clImportInput.value = '';
    });
  }

  const addBtn = document.getElementById('clAddBtn');
  const textInput = document.getElementById('clNewText');
  async function addItem(){
    const text = textInput.value.trim();
    if(!text){ toast('Escreva a tarefa antes de adicionar.', 'err'); return; }
    const u = state.currentUser;
    state.checklistItems.push({
      id: uid('cl'), company: document.getElementById('clNewCompany').value,
      text, responsavel: document.getElementById('clNewResp').value.trim(),
      priority: document.getElementById('clNewPriority').value, status:'pendente', observacao:'',
      createdBy: u.id, createdByName: u.name, createdAt: Date.now(),
    });
    await saveChecklist();
    textInput.value = '';
    document.getElementById('clNewResp').value = '';
    toast('Item adicionado ao checklist.');
    render();
  }
  if(addBtn) addBtn.addEventListener('click', addItem);
  if(textInput) textInput.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); addItem(); } });

  document.querySelectorAll('[data-checklist-status]').forEach(b=>{
    b.addEventListener('click', async ()=>{
      const item = state.checklistItems.find(i=>i.id===b.dataset.checklistStatus);
      if(!item) return;
      item.status = b.dataset.statusKey;
      await saveChecklist();
      render();
    });
  });
  document.querySelectorAll('[data-checklist-edit]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const item = state.checklistItems.find(i=>i.id===b.dataset.checklistEdit);
      if(item) openChecklistItemModal(item);
    });
  });
  document.querySelectorAll('[data-checklist-delete]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const item = state.checklistItems.find(i=>i.id===b.dataset.checklistDelete);
      if(!item) return;
      openConfirmModal(`Excluir o item "${item.text}" do checklist?`, async ()=>{
        state.checklistItems = state.checklistItems.filter(i=>i.id!==item.id);
        await saveChecklist();
        toast('Item excluído.');
        render();
      });
    });
  });
}

/* ================= 5W2H ================= */
const W2H_ROW_COUNT = 5;
const W2H_ROW_LABELS = [
  {key:'what', label:'O que', ph:'O que será feito'},
  {key:'why', label:'Por quê', ph:'Motivo / justificativa'},
  {key:'where', label:'Onde', ph:'Onde será feito'},
  {key:'who', label:'Quem', ph:'Quem é o responsável'},
  {key:'when', label:'Quando', ph:'Prazo'},
  {key:'how', label:'Como', ph:'Como será feito'},
  {key:'howMuch', label:'Quanto', ph:'Custo / quanto'},
];
const W2H_STATUS_OPTS = ['Não iniciado','Em andamento','Concluído'];
function emptyW2HRows(){
  return Array.from({length:W2H_ROW_COUNT}, ()=>({what:'',why:'',where:'',who:'',when:'',how:'',howMuch:'',status:'Não iniciado'}));
}
function w2hFilteredEntries(){
  const u = state.currentUser;
  const isMaster = u.role==='master';
  const f = state.w2hFilter;
  if(!isMaster){
    // colaborador sempre vê todos os próprios registros, em qualquer dia —
    // o mês/ano só serve como filtro de navegação para o master.
    return state.w2hEntries
      .filter(e=>e.employeeId===u.id)
      .sort((a,b)=> b.year-a.year || b.month-a.month || (b.submittedAt||0)-(a.submittedAt||0));
  }
  let list = state.w2hEntries.slice();
  if(f.collaborator!=='todos') list = list.filter(e=>e.employeeId===f.collaborator);
  if(f.state!=='todos') list = list.filter(e=>e.unitState===f.state);
  if(f.city && f.city.trim()) list = list.filter(e=>(e.unitCity||'').toLowerCase().includes(f.city.trim().toLowerCase()));
  if(f.month) list = list.filter(e=>e.month===Number(f.month));
  if(f.year) list = list.filter(e=>e.year===Number(f.year));
  return list.sort((a,b)=> b.year-a.year || b.month-a.month || (b.submittedAt||0)-(a.submittedAt||0));
}
function w2hTemplate(){
  const u = state.currentUser;
  const isMaster = u.role==='master';
  const now = new Date();
  const curMonth = now.getMonth()+1, curYear = now.getFullYear();
  const myCurrentEntry = w2hEntryFor(u.id, curMonth, curYear);

        : `${icon('info',16)} Fora do período de preenchimento (abre todo dia 20 e fecha dia 25) — você ainda pode visualizar todos os seus registros abaixo, só não é possível criar ou editar agora.`}

          <option value="todos">Todos os colaboradores</option>
          ${state.users.map(x=>`<option value="${x.id}" ${f.collaborator===x.id?'selected':''}>${escapeHtml(x.name)}</option>`).join('')}
        </select>
        <select id="w2hFilterState" style="padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:13px;font-weight:600;">
          <option value="todos">Todos os estados</option>
          ${BRAZIL_STATES.map(s=>`<option value="${s.uf}" ${f.state===s.uf?'selected':''}>${s.name}</option>`).join('')}
        </select>
        <input type="text" id="w2hFilterCity" placeholder="Cidade..." value="${escapeHtml(f.city||'')}" style="padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:13px;width:140px;">
        <select id="w2hFilterMonth" style="padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:13px;font-weight:600;">
          ${MONTH_NAMES_PT.map((m,i)=>`<option value="${i+1}" ${f.month===i+1?'selected':''}>${m}</option>`).join('')}
        </select>
        <input type="number" id="w2hFilterYear" value="${f.year}" style="padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:13px;width:84px;">
        ` : ''}
      </div>
      <button class="btn btn-primary" id="w2hNewBtn">${icon('plus',16)} ${isMaster?'Novo registro':'Preencher deste mês'}</button>
    </div>
    ${list.length ? `
    <div class="table-wrap">
      <table>
        <thead><tr><th>Unidade</th><th>Funcionário</th><th>Mês/Ano</th><th>Status</th><th></th></tr></thead>
        <tbody>
          ${list.map(e=>{
            const emp = userById(e.employeeId);
            return `<tr data-w2h-open="${e.id}" style="cursor:pointer;">
              <td>${escapeHtml(e.unitName||'—')} <span style="color:var(--text-400);">(${escapeHtml(e.unitCity||'')}/${escapeHtml(e.unitState||'')})</span></td>
              <td>${escapeHtml(emp?.name||e.employeeName||'—')}</td>
              <td class="mono">${MONTH_NAMES_PT[e.month-1]}/${e.year}</td>
              <td>${e.submittedAt ? `<span style="color:var(--green);font-weight:700;">Enviado ${new Date(e.submittedAt).toLocaleDateString('pt-BR')}</span>` : `<span style="color:var(--amber);font-weight:700;">Rascunho</span>`}</td>
              <td>${icon('chevronRight',14)}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>` : `<div class="empty-state">${icon('clipboard',40)}<h3>Nenhum registro encontrado</h3><p>Ajuste os filtros acima ou crie um novo registro.</p></div>`}
  `;
}
function attachW2HEvents(){
  const u = state.currentUser;
  const unreadW2H = notificationsForCurrentUser().filter(n=>!n.read && n.type==='w2h');
  if(unreadW2H.length){
    unreadW2H.forEach(n=>n.read=true);
    saveNotifications();
    render();
    return;
  }
  ['w2hFilterCollab','w2hFilterState','w2hFilterCity','w2hFilterMonth','w2hFilterYear'].forEach(id=>{
    const el = document.getElementById(id);
    if(!el) return;
    el.addEventListener('change', ()=>{
      if(id==='w2hFilterCollab') state.w2hFilter.collaborator = el.value;
      if(id==='w2hFilterState') state.w2hFilter.state = el.value;
      if(id==='w2hFilterCity') state.w2hFilter.city = el.value;
      if(id==='w2hFilterMonth') state.w2hFilter.month = Number(el.value);
      if(id==='w2hFilterYear') state.w2hFilter.year = Number(el.value);
      render();
    });
    if(id==='w2hFilterCity') el.addEventListener('input', ()=>{
      state.w2hFilter.city = el.value;
      const cursorPos = el.selectionStart;
      render();
      const freshEl = document.getElementById('w2hFilterCity');
      if(freshEl){ freshEl.focus(); freshEl.setSelectionRange(cursorPos, cursorPos); }
    });
  });
  document.querySelectorAll('[data-w2h-open]').forEach(row=>{
    row.addEventListener('click', ()=>{
      const entry = state.w2hEntries.find(e=>e.id===row.dataset.w2hOpen);
      if(entry) openW2HModal(entry);
    });
  });
  const newBtn = document.getElementById('w2hNewBtn');
  if(newBtn) newBtn.addEventListener('click', ()=>{
    if(u.role==='master'){ openW2HModal(null); return; }
    const now = new Date();
    const existing = w2hEntryFor(u.id, now.getMonth()+1, now.getFullYear());
    openW2HModal(existing || null, u.id, now.getMonth()+1, now.getFullYear());
  });
}
function openW2HModal(existing, presetEmployeeId, presetMonth, presetYear){
  const u = state.currentUser;
  const isMaster = u.role==='master';
  const isNew = !existing;
  const month = existing ? existing.month : (presetMonth || new Date().getMonth()+1);
  const year = existing ? existing.year : (presetYear || new Date().getFullYear());
  const employeeId = existing ? existing.employeeId : (presetEmployeeId || (isMaster ? '' : u.id));
  const isCurrentMonth = month===new Date().getMonth()+1 && year===new Date().getFullYear();
  const isOwn = employeeId===u.id;
  const editable = isMaster || (isOwn && isCurrentMonth && w2hWindowOpenNow());
  const rows = existing && existing.rows ? existing.rows : emptyW2HRows();

  const html = `
  <div class="modal-backdrop" id="w2hModalBackdrop">
    <div class="modal modal-lg">
      <div class="modal-head">
        <h3>Plano de Ação 5W2H ${!editable?'(somente visualização)':''}</h3>
        <button class="modal-close" id="w2hModalClose">${icon('x',18)}</button>
      </div>
      <div class="modal-body">
        <form id="w2hForm">
          <div class="grid2">
            <div class="field">
              <label>Funcionário</label>
              ${isMaster ? `
              <select id="w2hEmployee" ${!isNew?'disabled':''}>
                <option value="">Selecione...</option>
                ${state.users.map(x=>`<option value="${x.id}" ${employeeId===x.id?'selected':''}>${escapeHtml(x.name)}</option>`).join('')}
              </select>` : `<input type="text" value="${escapeHtml(u.name)}" disabled>`}
            </div>
            <div class="field">
              <label>Mês / Ano</label>
              <div style="display:flex;gap:8px;">
                <select id="w2hMonth" ${!(isMaster && isNew)?'disabled':''}>
                  ${MONTH_NAMES_PT.map((m,i)=>`<option value="${i+1}" ${month===i+1?'selected':''}>${m}</option>`).join('')}
                </select>
                <input type="number" id="w2hYear" value="${year}" ${!(isMaster && isNew)?'disabled':''} style="width:90px;">
              </div>
            </div>
          </div>
          <div class="grid3">
            <div class="field">
              <label for="w2hUnitName">Nome da unidade</label>
              <input type="text" id="w2hUnitName" value="${existing?escapeHtml(existing.unitName||''):''}" ${!editable?'disabled':''} placeholder="Ex: Unidade Centro">
            </div>
            <div class="field">
              <label for="w2hUnitState">Estado</label>
              <select id="w2hUnitState" ${!editable?'disabled':''}>
                <option value="">Selecione...</option>
                ${BRAZIL_STATES.map(s=>`<option value="${s.uf}" ${existing?.unitState===s.uf?'selected':''}>${s.name} (${s.uf})</option>`).join('')}
              </select>
            </div>
            <div class="field">
              <label for="w2hUnitCity">Cidade</label>
              <input type="text" id="w2hUnitCity" value="${existing?escapeHtml(existing.unitCity||''):''}" ${!editable?'disabled':''} placeholder="Ex: São Paulo">
            </div>
          </div>
          <div class="w2h-table-wrap">
            <table class="w2h-table">
              <thead><tr>${W2H_ROW_LABELS.map(c=>`<th>${c.label}</th>`).join('')}<th>Status</th></tr></thead>
              <tbody>
                ${rows.map((r,i)=>`
                <tr>
                  ${W2H_ROW_LABELS.map(c=>`<td class="${r[c.key]&&r[c.key].trim()?'w2h-filled':''}"><textarea data-w2h-row="${i}" data-w2h-col="${c.key}" placeholder="${c.ph}" ${!editable?'disabled':''}>${escapeHtml(r[c.key]||'')}</textarea></td>`).join('')}
                  <td>
                    <select data-w2h-row="${i}" data-w2h-col="status" ${!editable?'disabled':''}>
                      ${W2H_STATUS_OPTS.map(s=>`<option value="${s}" ${(r.status||'Não iniciado')===s?'selected':''}>${s}</option>`).join('')}
                    </select>
                  </td>
                </tr>`).join('')}
              </tbody>
            </table>
          </div>
          ${existing?.submittedAt ? `<div class="hint-text" style="margin-top:10px;">Último envio: ${new Date(existing.submittedAt).toLocaleString('pt-BR')}${existing.createdByName?' · por '+escapeHtml(existing.createdByName):''}</div>` : ''}
        </form>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" id="w2hModalCancel">${editable?'Cancelar':'Fechar'}</button>
        ${editable ? `<button class="btn btn-primary" id="w2hModalSave">${icon('check',15)} Enviar</button>` : ''}
      </div>
    </div>
  </div>`;
  document.getElementById('modalRoot').innerHTML = html;
  const close = ()=>{ document.getElementById('modalRoot').innerHTML=''; };
  document.getElementById('w2hModalClose').addEventListener('click', close);
  document.getElementById('w2hModalCancel').addEventListener('click', close);
  document.getElementById('w2hModalBackdrop').addEventListener('click', e=>{ if(e.target.id==='w2hModalBackdrop') close(); });
  // Realça a célula em verde claro assim que ela tem conteúdo — sem re-renderizar
  // a tela toda (o que tiraria o foco do campo enquanto a pessoa digita).
  document.querySelectorAll('.w2h-table textarea[data-w2h-row]').forEach(ta=>{
    ta.addEventListener('input', ()=>{

      if(td) td.classList.toggle('w2h-filled', ta.value.trim().length>0);
    });
  });

  const saveBtn = document.getElementById('w2hModalSave');
  if(saveBtn) saveBtn.addEventListener('click', async ()=>{

    const finalMonth = isMaster && isNew ? Number(document.getElementById('w2hMonth').value) : month;
    const finalYear = isMaster && isNew ? Number(document.getElementById('w2hYear').value) : year;
    const unitName = document.getElementById('w2hUnitName').value.trim();
    const unitState = document.getElementById('w2hUnitState').value;
    const unitCity = document.getElementById('w2hUnitCity').value.trim();
    if(!unitName || !unitState || !unitCity){ toast('Preencha nome da unidade, estado e cidade.', 'err'); return; }

    const newRows = emptyW2HRows();
    document.querySelectorAll('[data-w2h-row]').forEach(el=>{
      const idx = Number(el.dataset.w2hRow), col = el.dataset.w2hCol;
      newRows[idx][col] = el.value;
    });

    const empUser = userById(finalEmployeeId);
    const stamp = Date.now();
    if(existing){
      // impede duplicar em outra data caso alguém tenha alterado o mês (não deveria acontecer, mas por segurança)
      existing.unitName=unitName; existing.unitState=unitState; existing.unitCity=unitCity;
      existing.rows=newRows; existing.submittedAt=stamp; existing.createdByName=u.name;
    } else {
      const dupe = w2hEntryFor(finalEmployeeId, finalMonth, finalYear);
      if(dupe){ toast('Já existe um registro desse funcionário para esse mês — abra e edite.', 'err'); return; }
      state.w2hEntries.push({
        id: uid('w2h'), employeeId: finalEmployeeId, employeeName: empUser?.name,
        month: finalMonth, year: finalYear, unitName, unitState, unitCity,
        rows: newRows, submittedAt: stamp, createdBy: u.id, createdByName: u.name,
      });
    }
    await saveW2H();
    await addNotification({
      title:'5W2H preenchido',
      message:`${empUser?.name||'Alguém'} enviou o 5W2H de ${MONTH_NAMES_PT[finalMonth-1]}/${finalYear} (${unitName}).`,
      forRole:'master', type:'w2h',
    });
    if(u.id !== finalEmployeeId){
      await addNotification({
        title:'Seu 5W2H foi preenchido',
        message:`${u.name} preencheu o seu 5W2H de ${MONTH_NAMES_PT[finalMonth-1]}/${finalYear} (${unitName}). Você já pode visualizar.`,
        forUserId: finalEmployeeId, type:'w2h',
      });
    }
    toast('Plano de ação enviado.');
    close();
    render();
  });
}

/* ================= HISTÓRICO ================= */
function buildGlobalHistory(){
  const entries = [];
  state.tasks.forEach(t=>{
    (t.history||[]).forEach(h=>{
      entries.push({ kind:'agenda', icon:'clipboard', refTitle:t.title, note:h.note, date:h.date, time:h.time, byName:h.byName, userId:t.ownerId });
    });
  });
  state.dailyTasks.forEach(d=>{
    (d.history||[]).forEach(h=>{
      entries.push({ kind:'daily', icon:'calendar', refTitle:d.title, note:h.note, date:h.date, time:h.time, byName:h.byName, userId:d.assignedTo });
    });
  });
  state.w2hEntries.forEach(e=>{
    if(e.submittedAt){
      const dt = new Date(e.submittedAt);
      entries.push({
        kind:'w2h', icon:'clipboard', refTitle:`5W2H ${MONTH_NAMES_PT[e.month-1]}/${e.year}`, note:'Plano de ação enviado.',
        date:`${dt.getFullYear()}-${pad2(dt.getMonth()+1)}-${pad2(dt.getDate())}`, time:`${pad2(dt.getHours())}:${pad2(dt.getMinutes())}`,
        byName:e.createdByName, userId:e.employeeId,
      });
    }
  });
  entries.sort((a,b)=> (b.date+'T'+b.time).localeCompare(a.date+'T'+a.time));
  return entries;
}
function historyTemplate(){
  const u = state.currentUser;
  const isMaster = u.role==='master';
  let entries = buildGlobalHistory();
  if(!isMaster){
    entries = entries.filter(e=>e.userId===u.id);
  } else if(state.historyFilterUser!=='todos'){
    entries = entries.filter(e=>e.userId===state.historyFilterUser);
  }
  return `
    <div class="toolbar" style="margin-top:0;">
      <span class="mono" style="font-size:11px;color:var(--text-400);">${entries.length} registro(s)</span>
      ${isMaster ? `
      <select id="historyFilterUser" style="padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;font-size:13px;font-weight:600;">
        <option value="todos" ${state.historyFilterUser==='todos'?'selected':''}>Todos os usuários</option>
        ${state.users.map(x=>`<option value="${x.id}" ${state.historyFilterUser===x.id?'selected':''}>${escapeHtml(x.name)}</option>`).join('')}
      </select>` : ''}
    </div>
    ${entries.length ? `
    <div class="notice-list">
      ${entries.map(e=>{
        const eu = userById(e.userId);
        return `<div class="notice-item">
          <div class="notice-icon">${icon(e.icon,16)}</div>
          <div class="notice-body">
            <div class="notice-title">${escapeHtml(e.refTitle)}${eu?` <span style="color:var(--text-400);font-weight:500;">· ${escapeHtml(eu.name)}</span>`:''}</div>
            <div class="notice-msg">${escapeHtml(e.note||'')}</div>
            <div class="notice-time mono">${formatDateBR(e.date)} às ${escapeHtml(e.time||'')}${e.byName?' · por '+escapeHtml(e.byName):''}</div>
          </div>
        </div>`;
      }).join('')}
    </div>` : `<div class="empty-state">${icon('history',40)}<h3>Nada por aqui ainda</h3><p>O histórico de compromissos, tarefas e 5W2H vai aparecer aqui conforme for acontecendo.</p></div>`}
  `;
}
function attachHistoryEvents(){
  const sel = document.getElementById('historyFilterUser');
  if(sel) sel.addEventListener('change', ()=>{ state.historyFilterUser = sel.value; render(); });
}

/* ================= ASSINATURAS (dentro de Financeiro) ================= */
const SUB_CATEGORIES = ['IA','Design','Vídeo','Produtividade','Comunicação','Hospedagem','Sistema','Marketing','Financeiro','Outro'];
const SUB_CYCLES = [
  {key:'mensal', label:'Mensal', days:30, divisor:1},
  {key:'bimestral', label:'Bimestral', days:60, divisor:2},
  {key:'trimestral', label:'Trimestral', days:90, divisor:3},
  {key:'semestral', label:'Semestral', days:180, divisor:6},
  {key:'anual', label:'Anual', days:365, divisor:12},
  {key:'unico', label:'Pagamento único', days:null, divisor:null},
  {key:'outra', label:'Outra periodicidade', days:null, divisor:null},
];
function subCycleMeta(key){ return SUB_CYCLES.find(c=>c.key===key) || SUB_CYCLES[0]; }
const SUB_STATUS = [
  {key:'ativa', label:'Ativa', color:'#1f8f5f', bg:'#e4f7ee'},
  {key:'pendente', label:'Vence em breve', color:'#c9821f', bg:'#fdf1de'},
  {key:'vencida', label:'Vencida', color:'#c73838', bg:'#fbe7e7'},
  {key:'cancelada', label:'Cancelada', color:'#6b7280', bg:'#f1f2f4'},
  {key:'teste', label:'Em Teste', color:'#2148c9', bg:'#e8edfb'},
  {key:'pausada', label:'Pausada', color:'#7048c9', bg:'#efe8fb'},
];
function subStatusMeta(key){ return SUB_STATUS.find(s=>s.key===key) || SUB_STATUS[0]; }
// Estados que a pessoa escolhe manualmente no cadastro. "Vencida" e "Vence em
// breve" NUNCA são escolhidos à mão — são calculados sozinhos a partir da
// data de vencimento, toda vez que a tela é desenhada.
const SUB_MANUAL_STATUS = ['ativa','cancelada','teste','pausada'];
function subEffectiveStatus(sub){
  if(sub.status && sub.status!=='ativa' && SUB_MANUAL_STATUS.includes(sub.status)) return sub.status;
  if(!sub.dataVencimento) return 'ativa';
  const today = todayStr();
  if(sub.dataVencimento < today) return 'vencida';
  const daysLeft = Math.round((new Date(sub.dataVencimento+'T00:00:00') - new Date(today+'T00:00:00')) / 86400000);
  if(daysLeft <= 7) return 'pendente';
  return 'ativa';
}
// Avança a data de vencimento em um ciclo de cobrança de verdade (por MÊS,
// não por "+30 dias"), pra não acumular erro em meses com tamanhos diferentes.
const SUB_CYCLE_MONTHS = {mensal:1, bimestral:2, trimestral:3, semestral:6, anual:12};
function subAdvanceDueDate(dataVencimento, ciclo){
  const months = SUB_CYCLE_MONTHS[ciclo];
  if(!months || !dataVencimento) return dataVencimento;
  const today = new Date(todayStr()+'T00:00:00');
  const d = new Date(dataVencimento+'T00:00:00');
  d.setMonth(d.getMonth()+months);
  // Se a conta já estava atrasada em mais de um ciclo (ex: 2+ meses sem pagar),
  // um único "dar baixa" já resolve tudo de uma vez — sem isso, sobrava um
  // vencimento ainda no passado e a pessoa precisava dar baixa de novo.
  let guard = 0;
  while(d <= today && guard < 600){ d.setMonth(d.getMonth()+months); guard++; }
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
}
// Replica a fórmula da planilha original: próxima renovação = vencimento + dias do ciclo.
function subNextRenewal(sub){
  if(!sub.dataVencimento) return null;
  const cycle = subCycleMeta(sub.ciclo);
  if(!cycle.days) return null;
  const d = new Date(sub.dataVencimento+'T00:00:00');
  d.setDate(d.getDate() + cycle.days);
  return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
}
function subMonthlyEquivalent(sub){
  const cycle = subCycleMeta(sub.ciclo);
  if(!cycle.divisor) return 0;
  return (Number(sub.valor)||0) / cycle.divisor;
}
// Dias até a PRÓPRIA data de vencimento. Diferente de subDaysUntilRenewal,
// que soma um ciclo inteiro por cima e serve pra prever a cobrança seguinte.
function subDaysUntilDue(sub){
  if(!sub.dataVencimento) return null;
  return Math.round((new Date(sub.dataVencimento+'T00:00:00') - new Date(todayStr()+'T00:00:00')) / 86400000);
}
function subDaysUntilRenewal(sub){
  const next = subNextRenewal(sub);
  if(!next) return null;
  return Math.round((new Date(next+'T00:00:00') - new Date(todayStr()+'T00:00:00')) / 86400000);
}
function subscriptionsSummary(allSubs, dateFilter){
  dateFilter = dateFilter || {};
  const activeIsh = allSubs.filter(s=>!['cancelada','pausada'].includes(subEffectiveStatus(s)));

  // "Total desembolsado" = soma de TODOS os pagamentos já registrados (histórico
  // de baixas de verdade), não o valor cadastrado. Se houver filtro de período,
  // some só os pagamentos feitos dentro dele.
  let totalDesembolsado = 0;
  const detTotalDesembolsado = [];
  allSubs.forEach(s=>(s.historicoPagamentos||[]).forEach(p=>{
    if(dateFilter.dataInicio && p.data < dateFilter.dataInicio) return;
    if(dateFilter.dataFim && p.data > dateFilter.dataFim) return;
    totalDesembolsado += Number(p.valor)||0;
    detTotalDesembolsado.push({sub:s, data:p.data, valor:Number(p.valor)||0, tipo:'Pago'});
  }));

  // Métricas do mês corrente (calendário) — tudo que vence neste mês, pago ou não.
  const curMonthPrefix = todayStr().slice(0,7); // "YYYY-MM"
  let pagoMes = 0;
  const detPagoMes = [];
  const pagasNesteMes = new Set();
  allSubs.forEach(s=>(s.historicoPagamentos||[]).forEach(p=>{
    if(p.data && p.data.startsWith(curMonthPrefix)){
      pagoMes += Number(p.valor)||0;
      detPagoMes.push({sub:s, data:p.data, valor:Number(p.valor)||0, tipo:'Pago'});
      pagasNesteMes.add(s.id);
    }
  }));
  // "A pagar no mes" = vence neste mes e AINDA nao foi paga neste mes. Sem o
  // segundo teste, uma assinatura sem ciclo recorrente (pagamento unico)
  // entrava ao mesmo tempo em "a pagar" e em "pago" e dobrava o custo mensal.
  const detAPagarMes = allSubs
    .filter(s=>s.dataVencimento && s.dataVencimento.startsWith(curMonthPrefix) && !pagasNesteMes.has(s.id))
    .map(s=>({sub:s, data:s.dataVencimento, valor:Number(s.valor)||0, tipo:'A pagar'}));
  const aPagarMes = detAPagarMes.reduce((sum,r)=>sum+r.valor, 0);
  const custoMensal = aPagarMes + pagoMes;

  // Estimativa anual usa o valor normalizado por assinatura (mais estável que
  // projetar o mês corrente x12, que varia muito conforme o que cai nesse mês).
  const custoMensalEquivalente = activeIsh.reduce((sum,s)=>sum+subMonthlyEquivalent(s),0);

  const detCustoAnual = activeIsh
    .filter(s=>subMonthlyEquivalent(s)>0)
    .map(s=>({sub:s, data:s.dataVencimento, valor:subMonthlyEquivalent(s)*12, tipo:subCycleMeta(s.ciclo).label+' · '+fmtBRL(subMonthlyEquivalent(s))+'/mes'}));
  const detAtivas = activeIsh.map(s=>({sub:s, data:s.dataVencimento, valor:Number(s.valor)||0, tipo:subStatusMeta(subEffectiveStatus(s)).label}));
  const detVencidasPendentes = allSubs
    .filter(s=>['vencida','pendente'].includes(subEffectiveStatus(s)))
    .map(s=>({sub:s, data:s.dataVencimento, valor:Number(s.valor)||0, tipo:subStatusMeta(subEffectiveStatus(s)).label}));
  // "Vencem em 30 dias" olha a propria data de vencimento. Antes usava
  // subDaysUntilRenewal (vencimento + 1 ciclo inteiro), o que empurrava o prazo
  // pra frente demais e deixava o card em 0 mesmo com contas vencendo na semana.
  const detProximos = activeIsh
    .filter(s=>{ const d=subDaysUntilDue(s); return d!==null && d>=0 && d<=30; })
    .map(s=>{ const d=subDaysUntilDue(s); return {sub:s, data:s.dataVencimento, valor:Number(s.valor)||0, tipo: d===0?'vence hoje':('em '+d+' dia(s)')}; });

  return {
    totalDesembolsado, custoMensal, pagoMes, aPagarMes,
    custoAnual: custoMensalEquivalente*12,
    ativasCount: activeIsh.length,
    vencidasPendentes: detVencidasPendentes.length,
    proximosVencimentos: detProximos.length,
    detalhes: {
      custoMensal: detAPagarMes.concat(detPagoMes),
      pagoMes: detPagoMes,
      aPagarMes: detAPagarMes,
      custoAnual: detCustoAnual,
      ativas: detAtivas,
      vencidasPendentes: detVencidasPendentes,
      proximosVencimentos: detProximos,
      totalDesembolsado: detTotalDesembolsado,
    },
  };
}
function subscriptionsFiltered(){
  let list = state.subscriptions.slice();
  const f = state.subFilter;
  if(f.company!=='todas') list = list.filter(s=>s.grupo===f.company);
  if(f.category!=='todas') list = list.filter(s=>s.categoria===f.category);
  if(f.status!=='todas') list = list.filter(s=>subEffectiveStatus(s)===f.status);
  if(f.cycle!=='todas') list = list.filter(s=>s.ciclo===f.cycle);
  // O periodo casa por vencimento OU por pagamento feito dentro dele. Antes so
  // olhava o vencimento: como dar baixa empurra o vencimento pro mes seguinte,
  // filtrar "agosto" zerava a lista mesmo havendo pagamentos de agosto no
  // historico -- e junto zerava o filtro rapido "Pagas no periodo".
  if(f.dataInicio || f.dataFim){
    const dentroDoPeriodo = (d)=> !!d && (!f.dataInicio || d>=f.dataInicio) && (!f.dataFim || d<=f.dataFim);
    list = list.filter(s=> dentroDoPeriodo(s.dataVencimento) || (s.historicoPagamentos||[]).some(p=>dentroDoPeriodo(p.data)) );
  }
  if(f.search && f.search.trim()){
    const q = f.search.trim().toLowerCase();
    list = list.filter(s=> (s.ferramenta||'').toLowerCase().includes(q) || (s.plano||'').toLowerCase().includes(q) || (s.observacoes||'').toLowerCase().includes(q) || (s.responsavel||'').toLowerCase().includes(q));
  }
  if(state.subQuickFilter==='mes_atual'){
    const curMonthPrefix = todayStr().slice(0,7);
    list = list.filter(s=>{
      if(!s.dataVencimento) return false;
      if(s.dataVencimento.startsWith(curMonthPrefix)) return true; // vence neste mês
      return subEffectiveStatus(s)==='vencida'; // ou atrasada de mês(es) anterior(es) e ainda não paga
    });
  }
  if(state.subQuickFilter==='ativas') list = list.filter(s=>!['cancelada','pausada'].includes(subEffectiveStatus(s)));
  if(state.subQuickFilter==='vencidas') list = list.filter(s=>subEffectiveStatus(s)==='vencida');
  if(state.subQuickFilter==='pagas') list = list.filter(s=>{
    if(!Array.isArray(s.historicoPagamentos) || !s.historicoPagamentos.length) return false;
    if(!f.dataInicio && !f.dataFim) return true;
    return s.historicoPagamentos.some(p=> (!f.dataInicio || p.data>=f.dataInicio) && (!f.dataFim || p.data<=f.dataFim));
  });
  if(state.subQuickFilter==='canceladas') list = list.filter(s=>subEffectiveStatus(s)==='cancelada');
  if(state.subQuickFilter==='proximas') list = list.filter(s=>{ const d=subDaysUntilRenewal(s); return d!==null && d>=0 && d<=30; });
  const {field, dir} = state.subSort;
  list.sort((a,b)=>{
    let av = field==='proximaRenovacao' ? (subNextRenewal(a)||'') : (a[field]!==undefined?a[field]:'');
    let bv = field==='proximaRenovacao' ? (subNextRenewal(b)||'') : (b[field]!==undefined?b[field]:'');
    if(field==='valor'){ av=Number(av)||0; bv=Number(bv)||0; }
    const cmp = av>bv ? 1 : av<bv ? -1 : 0;
    return dir==='asc' ? cmp : -cmp;
  });
  return list;
}

function exportSubscriptionsExcel(){
  if(!window.XLSX){ toast('Biblioteca de Excel não carregou — verifique sua internet.', 'err'); return; }
  const rows = [
    ['Grupo','Ferramenta','Categoria','Plano','Data da Contratação','Data de vencimento','Valor (R$)','Ciclo de Cobrança','Último Pagamento','Forma de Pagamento','Status','Login','Senha','Responsável','Observações'],
    ...state.subscriptions.map(s=>{
      const lastPaid = Array.isArray(s.historicoPagamentos) && s.historicoPagamentos.length ? s.historicoPagamentos[s.historicoPagamentos.length-1] : null;
      return [
        companyMeta(s.grupo).label, s.ferramenta||'', s.categoria||'', s.plano||'',
        s.dataContratacao?formatDateBR(s.dataContratacao):'', s.dataVencimento?formatDateBR(s.dataVencimento):'',
        s.valor||0, subCycleMeta(s.ciclo).label, lastPaid?formatDateBR(lastPaid.data):'',
        s.formaPagamento||'', subStatusMeta(subEffectiveStatus(s)).label, s.login||'', s.senha||'', s.responsavel||'', s.observacoes||'',
      ];
    }),
  ];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), 'Assinaturas');
  XLSX.writeFile(wb, `mega-assinaturas-${todayStr()}.xlsx`);
  toast('Assinaturas exportadas.');
}
async function importSubscriptionsExcel(file){
  if(!window.XLSX){ toast('Biblioteca de Excel não carregou.', 'err'); return; }
  let wb;
  try{ wb = XLSX.read(await file.arrayBuffer(), {type:'array', cellDates:true}); }
  catch(e){ toast('Não foi possível ler o arquivo.', 'err'); return; }
  const sheetName = wb.SheetNames.find(n=>n.toLowerCase().includes('assinatura')) || wb.SheetNames[0];
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], {header:1, raw:true, defval:''});
  let headerIdx = -1;
  for(let i=0;i<rows.length;i++){
    const rowText = rows[i].map(c=>String(c||'').toLowerCase());
    if(rowText.some(c=>c.includes('ferramenta')) && rowText.some(c=>c.includes('grupo'))){ headerIdx = i; break; }
  }
  if(headerIdx<0){ toast('Não encontramos as colunas esperadas nesse arquivo.', 'err'); return; }
  // "Vencida"/"Pendente"/"Pago"/"A vencer" não são mais guardados — o status
  // desses casos é recalculado sozinho pela data de vencimento. Só os estados
  // manuais (cancelada/teste/pausada) são realmente importados.
  const STATUS_ALIASES = {'cancelada':'cancelada','em teste':'teste','pausada':'pausada'};
  const CYCLE_ALIASES = {'mensal':'mensal','bimestral':'bimestral','trimestral':'trimestral','semestral':'semestral','anual':'anual','único':'unico','unico':'unico'};
  const u = state.currentUser;
  const newSubs = [];
  for(let i=headerIdx+1;i<rows.length;i++){
    const row = rows[i];
    const ferramenta = String(row[1]||'').trim();
    if(!ferramenta) continue;
    const cycleLabel = String(row[7]||'').toLowerCase().trim();
    const statusLabel = String(row[10]||'').toLowerCase().trim();
    newSubs.push({
      id: uid('sub'), grupo: matchCompanyBrand(row[0]) || primaryCompany(u), ferramenta,
      categoria: String(row[2]||'').trim() || 'Outro', plano: String(row[3]||'').trim(),
      dataContratacao: excelValueToDateStr(row[4]), dataVencimento: excelValueToDateStr(row[5]),
      valor: Number(row[6])||0, ciclo: CYCLE_ALIASES[cycleLabel] || 'outra',
      formaPagamento: String(row[9]||'').trim(), status: STATUS_ALIASES[statusLabel] || 'ativa',
      login: String(row[11]||'').trim(), senha: String(row[12]||'').trim(),
      responsavel: String(row[13]||'').trim(), observacoes: String(row[14]||'').trim(),
      historicoPagamentos: [], ultimoPagamento: null,
      createdBy: u.id, createdByName: u.name, createdAt: Date.now(),
    });
  }
  if(!newSubs.length){ toast('Nenhuma assinatura reconhecida no arquivo.', 'err'); return; }
  openConfirmModal(`Encontramos ${newSubs.length} assinatura(s) no arquivo. Importar todas (adiciona ao que já existe)?`, async ()=>{
    state.subscriptions.push(...newSubs);
    await saveSubscriptions();
    toast('Assinaturas importadas.');
    render();
  });
}

// Reconhece a "Marca" de uma planilha importada mesmo quando o nome está
// abreviado (ex: "Mega Pro" em vez de "Mega Cursos Pro").
const FIN_BRAND_ALIASES = {
  'mega pro':'cursospro', 'mega cursos pro':'cursospro',
  'mega multi':'multicursos', 'mega multi cursos':'multicursos',
  'cvb':'cvb', 'instituto cvb':'cvb', 'instituto':'cvb',
  'estacio':'estacio', 'estácio':'estacio',
  'pessoal':'pessoal',
  'mega':'grupo', 'grupo mega':'grupo', 'grupo mega (geral)':'grupo',
};
function matchCompanyBrand(label){
  const norm = String(label||'').toLowerCase().trim();
  if(!norm) return null;
  if(FIN_BRAND_ALIASES[norm]) return FIN_BRAND_ALIASES[norm];
  const exact = COMPANIES.find(c=>c.label.toLowerCase()===norm);
  if(exact) return exact.key;
  const partial = COMPANIES.find(c=>c.label.toLowerCase().includes(norm) || norm.includes(c.label.toLowerCase()));
  return partial ? partial.key : null;
}

function exportFinanceiroExcel(){
  if(!window.XLSX){ toast('Biblioteca de Excel não carregou — verifique sua internet.', 'err'); return; }
  const wb = XLSX.utils.book_new();

  const comprasRows = [
    ['REGISTRO DE COMPRAS'], [],
    ['Data','Marca','Fornecedor','Item','Unid.','Qtd. Comprada','Preço Unit. (R$)','Total (R$)','Forma de Pagamento','Projeto Vinculado','Observações','Mês (ref.)'],
    ...state.finPurchases.map(p=>[
      p.date?formatDateBR(p.date):'', companyMeta(p.brand).label, p.supplier||'', p.item||'', p.unit||'',
      p.qty||0, p.unitPrice||0, (Number(p.qty)||0)*(Number(p.unitPrice)||0), p.paymentMethod||'', p.project||'', p.notes||'',
      p.date?monthRefOf(p.date):'',
    ]),
  ];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(comprasRows), 'Compras');

  const refs = [...new Set(state.finPurchases.map(p=>monthRefOf(p.date)).filter(Boolean))].sort();
  const fechRows = [['FECHAMENTO MENSAL — CONTROLE FINANCEIRO'], [], ['Mês','TOTAL CUSTOS (R$)']];
  let grandTotal = 0;
  refs.forEach(ref=>{
    const [y,m] = ref.split('-');
    const total = state.finPurchases.filter(p=>monthRefOf(p.date)===ref).reduce((s,p)=>s+(Number(p.qty)||0)*(Number(p.unitPrice)||0),0);
    grandTotal += total;
    fechRows.push([`${MONTH_NAMES_PT[Number(m)-1]}/${y}`, total]);
  });
  fechRows.push(['TOTAL', grandTotal]);
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(fechRows), 'Fechamento Mensal');

  const fornRows = [
    ['CADASTRO DE FORNECEDORES'], [],
    ['#','Fornecedor / Empresa','Categoria de Material','Contato / Responsável','WhatsApp','Telefone Fixo','E-mail','Instagram / Site','Endereço','Prazo de Entrega','Forma de Pagamento','Observações'],
    ...state.finSuppliers.map((s,i)=>[i+1, s.name||'',s.category||'',s.contact||'',s.whatsapp||'',s.phone||'',s.email||'',s.social||'',s.address||'',s.deliveryTime||'',s.paymentMethod||'',s.notes||'']),
  ];

function excelValueToDateStr(v){
  if(v==null || v==='') return '';
  if(v instanceof Date) return `${v.getFullYear()}-${pad2(v.getMonth()+1)}-${pad2(v.getDate())}`;
  if(typeof v === 'number'){
    try{ const d = XLSX.SSF.parse_date_code(v); if(d) return `${d.y}-${pad2(d.m)}-${pad2(d.d)}`; }catch(e){}
  }
  const m = String(v).match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
  if(m) return `${m[3]}-${pad2(Number(m[2]))}-${pad2(Number(m[1]))}`;
  return '';
}
async function importFinanceiroExcel(file){
  if(!window.XLSX){ toast('Biblioteca de Excel não carregou.', 'err'); return; }
  let wb;
  try{
    const buf = await file.arrayBuffer();
    wb = XLSX.read(buf, {type:'array', cellDates:true});
  }catch(e){ toast('Não foi possível ler o arquivo.', 'err'); return; }

  const findSheet = (...names)=> wb.SheetNames.find(n=>names.some(t=>n.toLowerCase().includes(t)));
  const sheetRows = (name)=> name ? XLSX.utils.sheet_to_json(wb.Sheets[name], {header:1, raw:true, defval:''}) : [];
  const findHeaderRow = (rows, must)=>{
    for(let i=0;i<rows.length;i++){
      const rowText = rows[i].map(c=>String(c||'').toLowerCase());
      if(must.every(k=>rowText.some(c=>c.includes(k)))) return i;
    }
    return -1;
  };

  const newPurchases = [];
  const comprasRows = sheetRows(findSheet('compras'));
  const cIdx = findHeaderRow(comprasRows, ['data','fornecedor']);
  if(cIdx>=0){
    for(let i=cIdx+1;i<comprasRows.length;i++){
      const row = comprasRows[i];
      if(!row || !row[0]) continue;
      const dateStr = excelValueToDateStr(row[0]);
      if(!dateStr) continue;
      const brandLabel = String(row[1]||'').trim();
      const brandKey = matchCompanyBrand(String(row[1]||'')) || primaryCompany(state.currentUser);
      newPurchases.push({
        id:uid('fp'), date:dateStr, brand:brandKey, supplier:String(row[2]||''), item:String(row[3]||''),
        unit:String(row[4]||''), qty:Number(row[5])||0, unitPrice:Number(row[6])||0,
        paymentMethod:String(row[8]||''), project:String(row[9]||''), notes:String(row[10]||''), createdAt:Date.now(),
      });
    }
  }

  const newSuppliers = [];
  const fornRows = sheetRows(findSheet('fornecedor'));
  const fIdx = findHeaderRow(fornRows, ['fornecedor / empresa']);
  if(fIdx>=0){
    for(let i=fIdx+1;i<fornRows.length;i++){
      const row = fornRows[i];
      if(!row || !row[1]) continue; // coluna 0 é o "#" (número da linha), o nome fica na coluna 1
      newSuppliers.push({
        id:uid('fs'), name:String(row[1]||''), category:String(row[2]||''), contact:String(row[3]||''),
        whatsapp:String(row[4]||''), phone:String(row[5]||''), email:String(row[6]||''), social:String(row[7]||''),
        address:String(row[8]||''), deliveryTime:String(row[9]||''), paymentMethod:String(row[10]||''), notes:String(row[11]||''), createdAt:Date.now(),
      });
    }
  }

  const newProjects = [];
  const projRows = sheetRows(findSheet('projeto'));
  const pIdx = findHeaderRow(projRows, ['projeto / arte']);
  if(pIdx>=0){
    for(let i=pIdx+1;i<projRows.length;i++){
      const row = projRows[i];
      if(!row || !row[2] || String(row[2]).toUpperCase().includes('TOTA')) continue;
      const statusLabel = String(row[5]||'').toLowerCase();
      const statusKey = (FIN_PROJECT_STATUS.find(s=>statusLabel.includes(s.label.toLowerCase()))||{}).key || 'andamento';
      newProjects.push({
        id:uid('fj'), startDate:excelValueToDateStr(row[0]), endDate:excelValueToDateStr(row[1]), name:String(row[2]||''),
        type:String(row[3]||''), client:String(row[4]||''), status:statusKey, value:Number(row[6])||0, createdAt:Date.now(),
      });
    }
  }

  if(!newPurchases.length && !newSuppliers.length && !newProjects.length){
    toast('Nenhum dado reconhecido nesse arquivo.', 'err');
    return;
  }
  openConfirmModal(`Encontramos ${newPurchases.length} compra(s), ${newSuppliers.length} fornecedor(es) e ${newProjects.length} projeto(s). Importar tudo (adiciona ao que já existe)?`, async ()=>{
    state.finPurchases.push(...newPurchases);
    state.finSuppliers.push(...newSuppliers);
    state.finProjects.push(...newProjects);
    await saveFinPurchases(); await saveFinSuppliers(); await saveFinProjects();
    toast('Dados financeiros importados.');
    render();
  });
}

function handleImportFile(file){
  if(!window.XLSX){ toast('Biblioteca de Excel não carregou.', 'err'); return; }
  const reader = new FileReader();
  reader.onload = (e)=>{
    let wb;
    try{ wb = XLSX.read(e.target.result, {type:'array'}); }
    catch(err){ toast('Arquivo inválido — selecione um backup exportado pelo próprio painel.', 'err'); return; }

    const sheetObjs = (name)=> wb.SheetNames.includes(name) ? XLSX.utils.sheet_to_json(wb.Sheets[name], {defval:''}) : [];
    const usersRaw = sheetObjs('Usuarios');
    const tasksRaw = sheetObjs('Compromissos');
    const taskHistRaw = sheetObjs('Compromissos Historico');
    const dailyRaw = sheetObjs('TarefasDoDia');
    const dailyHistRaw = sheetObjs('TarefasDoDia Historico');
    if(!usersRaw.length){
      toast('Arquivo inválido — selecione um backup exportado pelo próprio painel.', 'err'); return;
    }

    const users = usersRaw.map(r=>({
      id:String(r.id), name:r['Nome'], username:r['Usuário'], password:String(r['Senha']),
      role:r['Papel'], companies:String(r['Empresas']||'').split(',').map(s=>s.trim()).filter(Boolean),
      tabs:String(r['Abas com acesso']||'').split(',').map(s=>s.trim()).filter(Boolean),
      canViewOthersAgenda:r['Pode ver agenda de outros']==='sim', agendaHiddenFromOthers:r['Agenda privada']==='sim',
    }));
    const tasks = tasksRaw.map(r=>{
      const participants = String(r['Participantes (id:status)']||'').split(',').map(s=>s.trim()).filter(Boolean).map(pair=>{
        const [userId,status] = pair.split(':'); return {userId, status};
      });
      const history = taskHistRaw.filter(h=>String(h['TarefaId'])===String(r.id)).map(h=>({date:h['Data'],time:h['Hora'],status:h['Status'],note:h['Nota'],byId:h['PorId'],byName:h['Por']}));
      return {
        id:String(r.id), title:r['Título'], type:r['Tipo'], company:r['Empresa'], date:r['Data'], time:r['Horário']||'',
        link:r['Link']||'', description:r['Descrição']||'', ownerId:String(r['ResponsávelId']), ownerName:r['Responsável'],
        taskStatus:r['Status'], participants, history, createdAt:Date.now(),
      };
    });
    const dailyTasks = dailyRaw.map(r=>{
      const history = dailyHistRaw.filter(h=>String(h['TarefaId'])===String(r.id)).map(h=>({date:h['Data'],time:h['Hora'],status:h['Status'],note:h['Nota'],byId:h['PorId'],byName:h['Por']}));
      return {
        id:String(r.id), title:r['Título'], date:r['Data'], time:r['Horário']||'', assignedTo:String(r['ColaboradorId']),
        assignedToName:r['Colaborador'], createdBy:String(r['CriadoPorId']), createdByName:r['CriadoPor'],
        status:r['Status'], history, createdAt:Date.now(),
      };
    });

    openConfirmModal('Importar este backup vai substituir todos os usuários e tarefas cadastrados atualmente neste painel. Deseja continuar?', async ()=>{
      state.users = users;
      state.tasks = tasks;
      state.dailyTasks = dailyTasks;
      await saveUsers();
      await saveTasks();
      await saveDailyTasks();
      toast('Backup importado com sucesso.');
      state.view = 'team';
      render();
    });
  };
  reader.onerror = ()=> toast('Não foi possível ler o arquivo.', 'err');
  reader.readAsArrayBuffer(file);
}

function openUserModal(existing){
  const isEdit = !!existing;
  const previewInner = existing ? avatarInner(existing) : icon('users',22);
  const html = `
  <div class="modal-backdrop" id="userModalBackdrop">
    <div class="modal modal-sm">
      <div class="modal-head">
        <h3>${isEdit?'Editar usuário':'Novo usuário'}</h3>
        <button class="modal-close" id="userModalClose">${icon('x',18)}</button>
      </div>
      <div class="modal-body">
        <form id="userForm">
          <div class="field">
            <label>Foto de perfil</label>
            <div class="avatar-upload-row">
              <div class="avatar avatar-preview" id="uAvatarPreview">${previewInner}</div>
              <div style="display:flex;gap:8px;flex-wrap:wrap;">
                <input type="file" id="uAvatarFile" accept="image/*" style="display:none;">
                <button type="button" class="btn btn-ghost btn-sm" id="uAvatarPickBtn">${icon('upload',14)} Escolher foto</button>
                ${isEdit && existing.hasAvatar ? `<button type="button" class="btn btn-ghost btn-sm" id="uAvatarRemoveBtn" style="color:var(--red);">${icon('x',14)} Remover</button>` : ''}
              </div>
            </div>
            <div class="hint-text">A foto é recortada em quadrado e redimensionada automaticamente.</div>
          </div>
          <div class="field">
            <label for="uName">Nome completo</label>
            <input type="text" id="uName" value="${existing?escapeHtml(existing.name):''}" required>
          </div>
          <div class="grid2">
            <div class="field">
              <label for="uCargo">Cargo</label>
              <input type="text" id="uCargo" value="${existing?escapeHtml(existing.cargo||''):''}" placeholder="Ex: Gerente de Unidade">
            </div>
            <div class="field">
              <label for="uCpf">CPF</label>
              <input type="text" id="uCpf" value="${existing?escapeHtml(existing.cpf||''):''}" placeholder="000.000.000-00" maxlength="14">
              <div class="hint-text" id="uCpfHint" style="display:none;color:var(--red);">CPF inválido — confira os números digitados.</div>
            </div>
          </div>
          <div class="grid3">
            <div class="field">
              <label for="uUnidade">Unidade</label>
              <input type="text" id="uUnidade" value="${existing?escapeHtml(existing.unidade||''):''}" placeholder="Ex: Unidade Centro">
            </div>
            <div class="field">
              <label for="uEstado">Estado</label>
              <select id="uEstado">
                <option value="">Selecione...</option>
                ${BRAZIL_STATES.map(s=>`<option value="${s.uf}" ${existing?.estado===s.uf?'selected':''}>${s.name} (${s.uf})</option>`).join('')}
              </select>
            </div>
            <div class="field">
              <label for="uCidade">Cidade</label>
              <input type="text" id="uCidade" value="${existing?escapeHtml(existing.cidade||''):''}">
            </div>
          </div>
          <div class="field">
            <label for="uPhone">Telefone (WhatsApp)</label>
            <input type="text" id="uPhone" value="${existing?escapeHtml(existing.phone||''):''}" placeholder="(00) 00000-0000" maxlength="15">
          </div>
          <div class="grid2">
            <div class="field">
              <label for="uUsername">Usuário (login)</label>
              <input type="text" id="uUsername" value="${existing?escapeHtml(existing.username):''}" required>
            </div>
            <div class="field">
              <label for="uPassword">Senha</label>
              <input type="text" id="uPassword" value="${existing?escapeHtml(existing.password):''}" required>
            </div>
          </div>
          <div class="field">
            <label for="uRole">Papel</label>
            <select id="uRole">
              <option value="user" ${existing?.role==='user'?'selected':''}>Usuário</option>
              <option value="master" ${existing?.role==='master'?'selected':''}>Operador Master</option>
            </select>
            <div class="hint-text">O papel define o nível de confiança geral; as abas abaixo controlam exatamente o que essa pessoa enxerga.</div>
          </div>
          <div class="field" id="uPrivacyFields" style="${existing?.role==='master'?'':'display:none;'}">
            <label>Privacidade da agenda (Agenda Mensal e Agenda do Dia)</label>
            <label class="check-item">
              <input type="checkbox" id="uCanViewOthers" ${existing?.canViewOthersAgenda?'checked':''}>
              <span>Pode ver a agenda de outras pessoas (não só a própria)</span>
            </label>
            <label class="check-item">
              <input type="checkbox" id="uAgendaHidden" ${(!existing || existing.agendaHiddenFromOthers!==false)?'checked':''}>
              <span>Manter a própria agenda privada (outros masters não conseguem ver)</span>
            </label>
            <div class="hint-text">Por padrão, nenhum master vê a agenda de outra pessoa — libere manualmente aqui quem pode.</div>
          </div>
          <div class="field">
            <label>Abas com acesso</label>
            <div class="check-list" id="uTabs">
              ${ALL_TABS.map(t=>{
                const isSelfTeamLock = existing && existing.id===state.currentUser.id && existing.role==='master' && t.key==='team';
                const checked = existing ? userTabs(existing).includes(t.key) : DEFAULT_TABS_USER.includes(t.key);
                return `
                <label class="check-item">
                  <input type="checkbox" value="${t.key}" ${checked?'checked':''} ${isSelfTeamLock?'disabled':''}>
                  <span>${t.label}${isSelfTeamLock?' <span style="color:var(--text-400);">(seu próprio acesso — não pode remover)</span>':''}</span>
                </label>`;
              }).join('')}
            </div>
            <div class="hint-text">Selecione quais abas essa pessoa poderá ver e usar no painel.</div>
          </div>
          <div class="field">
            <label>Empresas com acesso</label>
            <div class="check-list" id="uCompanies">
              ${COMPANIES.map(c=>`
                <label class="check-item">
                  <input type="checkbox" value="${c.key}" ${existing ? (userCompanies(existing).includes(c.key)?'checked':'') : (c.key==='grupo'?'checked':'')}>
                  <span class="dot" style="width:9px;height:9px;border-radius:50%;background:${c.color};flex-shrink:0;"></span>
                  <span>${c.label}</span>
                </label>`).join('')}
            </div>
            <div class="hint-text">Marque uma ou mais empresas às quais esse usuário terá acesso.</div>
          </div>
          <div class="error-msg" id="userError"></div>
        </form>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" id="userModalCancel">Cancelar</button>
        <button class="btn btn-primary" id="userModalSave">${isEdit?'Salvar':'Cadastrar'}</button>
      </div>
    </div>
  </div>`;
  document.getElementById('modalRoot').innerHTML = html;
  const close = ()=>{ document.getElementById('modalRoot').innerHTML=''; };
  document.getElementById('userModalClose').addEventListener('click', close);
  document.getElementById('userModalCancel').addEventListener('click', close);
  document.getElementById('userModalBackdrop').addEventListener('click', e=>{ if(e.target.id==='userModalBackdrop') close(); });

  let pendingAvatarDataUrl = null;
  let removeAvatarFlag = false;
  const avatarPreview = document.getElementById('uAvatarPreview');
  document.getElementById('uAvatarPickBtn').addEventListener('click', ()=> document.getElementById('uAvatarFile').click());
  const cpfInput = document.getElementById('uCpf');
  cpfInput.addEventListener('input', ()=>{
    const cursor = cpfInput.selectionStart;
    const before = cpfInput.value.length;
    cpfInput.value = formatCPF(cpfInput.value);
    const diff = cpfInput.value.length - before;
    cpfInput.setSelectionRange(cursor+diff, cursor+diff);
    document.getElementById('uCpfHint').style.display = 'none';
  });
  const phoneInput = document.getElementById('uPhone');
  phoneInput.addEventListener('input', ()=>{
    const cursor = phoneInput.selectionStart;
    const before = phoneInput.value.length;
    phoneInput.value = formatPhone(phoneInput.value);
    const diff = phoneInput.value.length - before;
    phoneInput.setSelectionRange(cursor+diff, cursor+diff);
  });
  document.getElementById('uRole').addEventListener('change', (e)=>{
    document.getElementById('uPrivacyFields').style.display = e.target.value==='master' ? '' : 'none';
  });
  document.getElementById('uAvatarFile').addEventListener('change', async (e)=>{
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    if(!file.type.startsWith('image/')){ toast('Selecione um arquivo de imagem.', 'err'); return; }
    try{
      pendingAvatarDataUrl = await resizeImageFile(file);
      removeAvatarFlag = false;
      avatarPreview.innerHTML = `<img src="${pendingAvatarDataUrl}" alt="">`;
    }catch(err){
      toast('Não foi possível processar essa imagem.', 'err');
    }
  });
  const removeBtn = document.getElementById('uAvatarRemoveBtn');
  if(removeBtn) removeBtn.addEventListener('click', ()=>{
    pendingAvatarDataUrl = null;
    removeAvatarFlag = true;
    avatarPreview.innerHTML = escapeHtml(initials(document.getElementById('uName').value || ''));
    removeBtn.remove();
  });

  document.getElementById('userModalSave').addEventListener('click', async ()=>{
    const name = document.getElementById('uName').value.trim();
    const username = document.getElementById('uUsername').value.trim();
    const password = document.getElementById('uPassword').value.trim();
    const cargo = document.getElementById('uCargo').value.trim();
    const cpf = document.getElementById('uCpf').value.trim();
    const unidade = document.getElementById('uUnidade').value.trim();
    const estado = document.getElementById('uEstado').value;
    const cidade = document.getElementById('uCidade').value.trim();
    const phone = document.getElementById('uPhone').value.trim();
    const companies = Array.from(document.querySelectorAll('#uCompanies input:checked')).map(i=>i.value);
    const isSelfTeamLock = existing && existing.id===state.currentUser.id && existing.role==='master';
    const tabs = Array.from(document.querySelectorAll('#uTabs input:checked')).map(i=>i.value);
    if(isSelfTeamLock && !tabs.includes('team')) tabs.push('team');
    const role = document.getElementById('uRole').value;
    const canViewOthersAgenda = role==='master' ? document.getElementById('uCanViewOthers').checked : false;
    const agendaHiddenFromOthers = role==='master' ? document.getElementById('uAgendaHidden').checked : false;
    const errEl = document.getElementById('userError');
    if(!name || !username || !password){ errEl.textContent='Preencha todos os campos.'; return; }
    if(cpf && !isValidCPF(cpf)){ document.getElementById('uCpfHint').style.display=''; errEl.textContent='Confira o CPF informado.'; return; }
    if(!companies.length){ errEl.textContent='Selecione ao menos uma empresa.'; return; }
    if(!tabs.length){ errEl.textContent='Selecione ao menos uma aba de acesso.'; return; }
    const dupe = state.users.find(x=>x.username.toLowerCase()===username.toLowerCase() && x.id!==(existing?existing.id:null));
    if(dupe){ errEl.textContent='Já existe um usuário com esse login.'; return; }

    const userId = existing ? existing.id : uid('u');
    let hasAvatar = existing ? !!existing.hasAvatar : false;
    if(pendingAvatarDataUrl){
      const ok = await saveAvatarData(userId, pendingAvatarDataUrl);
      if(ok) hasAvatar = true;
    } else if(removeAvatarFlag){
      await deleteAvatarData(userId);
      hasAvatar = false;
    }

    if(isEdit){
      existing.name=name; existing.username=username; existing.password=password; existing.companies=companies; existing.role=role; existing.tabs=tabs; existing.hasAvatar=hasAvatar;
      existing.canViewOthersAgenda=canViewOthersAgenda; existing.agendaHiddenFromOthers=agendaHiddenFromOthers;
      existing.cargo=cargo; existing.cpf=cpf; existing.unidade=unidade; existing.estado=estado; existing.cidade=cidade; existing.phone=phone;
      toast('Usuário atualizado.');
    } else {
      state.users.push({id:userId, name, username, password, companies, role, tabs, hasAvatar, canViewOthersAgenda, agendaHiddenFromOthers, cargo, cpf, unidade, estado, cidade, phone});
      toast('Usuário cadastrado.');
    }
    await saveUsers();
    close();
    render();
  });
}

/* ================= BOOTSTRAP ================= */
render();
loadData().then(()=>{ render(); checkReminders(); });

// Atualização quase em tempo real (fallback para quando o Firebase não está
// configurado): enquanto a aba "Tarefas do Dia" estiver aberta e nenhum modal
// aberto, busca dados novos periodicamente. Com o Firebase ativo, isso não é
// necessário — a sincronização chega instantaneamente via window.__handleRemoteUpdate.
setInterval(async ()=>{
  if(!state.ready || !state.currentUser) return;
  if(window.__firebaseConfigured) return;
  if(state.view!=='daily') return;
  const modalRoot = document.getElementById('modalRoot');
  if(modalRoot && modalRoot.innerHTML.trim()!=='') return;
  try{
    const r = await window.storage.get('mega_daily_tasks', true);
    const fresh = r ? JSON.parse(r.value) : [];
    if(JSON.stringify(fresh) !== JSON.stringify(state.dailyTasks)){
      state.dailyTasks = fresh;
      render();
    }
  }catch(e){ /* ignora falhas de sincronização silenciosamente */ }
}, 12000);

// Verifica lembretes de agenda (5 min antes) a cada 20s. Quando o Firebase não
// está configurado, também atualiza as tarefas em segundo plano (fallback),
// para que o aviso funcione mesmo com compromissos criados por outra pessoa.
setInterval(async ()=>{
  if(!state.ready || !state.currentUser) return;
  if(!window.__firebaseConfigured){
    try{
      const r = await window.storage.get('mega_tasks', true);
      const fresh = r ? JSON.parse(r.value) : [];
      if(JSON.stringify(fresh) !== JSON.stringify(state.tasks)){
        state.tasks = fresh;
        if(state.view==='agenda'){
          const modalRoot = document.getElementById('modalRoot');
          const modalOpen = modalRoot && modalRoot.innerHTML.trim()!=='';
          if(!modalOpen) render();
        }
      }
    }catch(e){ /* ignora falhas de sincronização silenciosamente */ }
  }
  checkReminders();
}, 20000);

// Atualiza as cores de urgência do horário (verde/amarelo/vermelho) na Agenda
// do Dia periodicamente, já que elas dependem da hora atual.
setInterval(()=>{
  if(!state.ready || !state.currentUser) return;
  if(state.view!=='daily') return;
  const modalRoot = document.getElementById('modalRoot');
  if(modalRoot && modalRoot.innerHTML.trim()!=='') return;
  render();
}, 60000);
</script>
